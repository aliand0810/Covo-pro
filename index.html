<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="covo-version" content="v45 · 2026-11-27"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COVO Pro</title>
<script>location.replace('app/' + location.search + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=app/"></noscript>
</head><body style="font-family:system-ui;padding:24px"><a href="app/">Ouvrir COVO Pro</a><script>
/* 📦 Version de l'application (ajoutée automatiquement à chaque mise à jour de la suite COVO)
   • petite mention « v45 » en bas à gauche ; un clic affiche les détails
   • la version utilisée sur cet appareil est notée (covo_app_versions) pour le rapport de COVO Pro
   • COVO Pro : rapport « 📦 Versions de la suite » (version en ligne de chaque satellite, nouveautés, mises à jour à faire) */
(function () {
    'use strict';
    if (window.COVO_VERSION) return;
    var ME = { app: 'portail', name: 'Portail (accueil)', v: '45', date: '2026-11-27', maj: 'MAJ-46' };
    window.COVO_VERSION = ME;
    var MAN = {};            // copie du manifeste au moment de la mise à jour (sert hors ligne)
    var URL_MAN = 'versions.json';
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function J(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
    function fd(s) { var d = new Date(s); return isNaN(d) ? String(s || '—') : d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }); }
    // version utilisée sur cet appareil
    try { var seen = J('covo_app_versions', {}) || {}; var prev = seen[ME.app]; seen[ME.app] = { v: ME.v, date: ME.date, at: new Date().toISOString(), name: ME.name }; localStorage.setItem('covo_app_versions', JSON.stringify(seen)); if (prev && prev.v !== ME.v) ME.updatedFrom = prev.v; } catch (e) {}

    function css() {
        if ($('cver-css')) return;
        var s = document.createElement('style'); s.id = 'cver-css';
        s.textContent = '#cver-badge{position:fixed;left:78px;bottom:10px;z-index:2147480000;font:700 10.5px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:4px 7px;border-radius:7px;border:1px solid rgba(127,127,127,.3);background:rgba(255,255,255,.82);color:#475569;cursor:pointer;opacity:.75;backdrop-filter:blur(4px)}#cver-badge:hover{opacity:1}#cver-badge.new{background:#7c3aed;color:#fff;border-color:#7c3aed;opacity:1}'
            + 'body.dark-mode #cver-badge{background:rgba(15,23,42,.8);color:#cbd5e1}@media print{#cver-badge{display:none!important}}'
            + '#cver-ov{position:fixed;inset:0;z-index:2147481200;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:14px;font-family:inherit}'
            + '#cver-box{background:var(--bg-card,#fff);color:var(--text-main,#0f172a);width:min(820px,100%);max-height:92vh;display:flex;flex-direction:column;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}'
            + '#cver-box .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff}#cver-box .hd b{font-size:1.05rem}#cver-box .hd small{display:block;opacity:.85;font-size:.74rem}#cver-box .hd button{margin-left:auto;border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:9px;width:32px;height:32px;cursor:pointer}'
            + '#cver-bd{padding:14px 18px;overflow:auto}#cver-bd table{width:100%;border-collapse:collapse;font-size:.82rem}#cver-bd th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.3px;color:var(--text-muted,#64748b);padding:7px 8px;border-bottom:1px solid var(--border-color,#e5e7eb)}#cver-bd td{padding:8px;border-bottom:1px solid var(--border-color,#eef2f7);vertical-align:top}'
            + '.cver-ok{color:#15803d;font-weight:800}.cver-up{color:#b45309;font-weight:800}.cver-na{color:#64748b}.cver-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-weight:900;font-size:.76rem;background:rgba(124,58,237,.12);color:#6d28d9}'
            + '.cver-log{margin-top:14px}.cver-log h4{margin:0 0 6px;font-size:.86rem}.cver-log div{font-size:.8rem;padding:6px 0;border-top:1px dashed var(--border-color,#e5e7eb);line-height:1.45}.cver-log b{color:#6d28d9}';
        document.head.appendChild(s);
    }
    function badge() {
        if (!document.body) return setTimeout(badge, 300);
        css(); if ($('cver-badge')) return;
        var b = document.createElement('button'); b.type = 'button'; b.id = 'cver-badge';
        b.textContent = 'v' + ME.v; b.title = ME.name + ' — version ' + ME.v + ' du ' + fd(ME.date) + (ME.app === 'app' ? ' · cliquer : versions de toute la suite' : '');
        if (ME.updatedFrom) { b.classList.add('new'); b.textContent = '🆕 v' + ME.v; }
        b.addEventListener('click', function () { b.classList.remove('new'); b.textContent = 'v' + ME.v; report(); });
        document.body.appendChild(b);
        if (ME.updatedFrom) try { setTimeout(function () { showScanToast('🆕 ' + ME.name + ' mis à jour : v' + ME.updatedFrom + ' → v' + ME.v, 'success'); }, 2500); } catch (e) {}
    }
    function loadMan() {
        return fetch(URL_MAN + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (m) { return { m: m, online: true }; })
            .catch(function () { return { m: MAN, online: false }; });
    }
    function report() {
        css(); var o = $('cver-ov'); if (o) o.remove();
        o = document.createElement('div'); o.id = 'cver-ov';
        o.innerHTML = '<div id="cver-box"><div class="hd"><span style="font-size:1.5rem">📦</span><div><b>' + (ME.app === 'app' ? 'Versions de la suite COVO' : esc(ME.name) + ' — version') + '</b><small>Mis à jour automatiquement à chaque nouvelle version</small></div><button type="button" data-x="1" aria-label="Fermer">✕</button></div><div id="cver-bd">⏳ Lecture des versions en ligne…</div></div>';
        document.body.appendChild(o);
        o.addEventListener('click', function (e) { if (e.target === o || e.target.closest('[data-x]')) o.remove(); if (e.target.closest('[data-reload]')) location.reload(); });
        loadMan().then(function (r) {
            var m = r.m || {}, A = m.apps || {}, seen = J('covo_app_versions', {}) || {}, bd = $('cver-bd'); if (!bd) return;
            var mine = A[ME.app], h = '';
            if (mine && mine.v !== ME.v) h += '<div style="padding:10px 12px;border-radius:11px;background:rgba(245,158,11,.12);color:#92400e;font-weight:700;margin-bottom:12px">🔄 Une version plus récente de ' + esc(ME.name) + ' est en ligne (v' + esc(mine.v) + ', vous utilisez v' + esc(ME.v) + '). <button type="button" data-reload="1" style="margin-left:8px;border:none;border-radius:8px;padding:6px 11px;font-weight:800;background:#b45309;color:#fff;cursor:pointer">Recharger</button></div>';
            h += '<div style="font-size:.8rem;margin-bottom:10px;color:var(--text-muted,#64748b)">' + (r.online ? '🌐 Versions publiées en ligne' : '📴 Hors ligne : versions connues lors de la dernière mise à jour') + ' · suite <span class="cver-pill">' + esc(m.suite || ME.maj) + '</span> du ' + esc(fd(m.built || ME.date)) + '</div>';
            if (ME.app === 'app') {
                var keys = Object.keys(A).sort(function (a, b) { return (A[a].order != null ? A[a].order : 99) - (A[b].order != null ? A[b].order : 99); });
                h += '<table><thead><tr><th>Application</th><th>Version en ligne</th><th>Sur cet appareil</th><th>Dernière nouveauté</th></tr></thead><tbody>'
                    + keys.map(function (k) {
                        var a = A[k], s = seen[k], st = !s ? '<span class="cver-na">jamais ouverte ici</span>' : s.v === a.v ? '<span class="cver-ok">✅ v' + esc(s.v) + ' à jour</span>' : '<span class="cver-up">🔄 v' + esc(s.v) + ' — à recharger</span>';
                        return '<tr><td><b>' + esc(a.name) + '</b></td><td><span class="cver-pill">v' + esc(a.v) + '</span><br><small style="color:var(--text-muted,#64748b)">' + esc(fd(a.date)) + '</small></td><td>' + st + '</td><td style="font-size:.78rem">' + esc(a.note || '—') + '</td></tr>';
                    }).join('') + '</tbody></table>'
                    + '<div style="font-size:.74rem;color:var(--text-muted,#64748b);margin-top:8px">« À recharger » : l’application a été ouverte sur cet appareil dans une version plus ancienne — ouvrez-la et appuyez sur Ctrl + F5 (ou fermez/rouvrez l’application installée).</div>';
            } else {
                h += '<div style="font-size:.9rem"><b>' + esc(ME.name) + '</b> — version <span class="cver-pill">v' + esc(ME.v) + '</span> du ' + esc(fd(ME.date)) + '</div>';
            }
            var log = (m.changes || []).filter(function (c) { return ME.app === 'app' || (c.apps || []).indexOf(ME.app) >= 0; }).slice(0, 12);
            if (log.length) h += '<div class="cver-log"><h4>📝 Nouveautés' + (ME.app === 'app' ? ' de la suite' : '') + '</h4>' + log.map(function (c) { return '<div><b>v' + esc(c.maj) + '</b> · ' + esc(fd(c.date)) + ' — ' + esc(c.text) + (ME.app === 'app' && c.apps ? ' <small style="color:var(--text-muted,#64748b)">(' + esc(c.apps.map(function (k) { return (A[k] && A[k].name) || k; }).join(', ')) + ')</small>' : '') + '</div>'; }).join('') + '</div>';
            bd.innerHTML = h;
        });
    }
    window.covoVersionReport = report;
    // COVO Pro : signale une fois les satellites mis à jour depuis la dernière consultation
    if (ME.app === 'app') setTimeout(function () {
        loadMan().then(function (r) {
            if (!r.online || !r.m || !r.m.apps) return;
            var k = 'covo_versions_seen', last = J(k, {}) || {}, A = r.m.apps, nw = [];
            Object.keys(A).forEach(function (a) { if (a !== 'app' && last[a] && last[a] !== A[a].v) nw.push(A[a].name + ' v' + A[a].v); if (!last[a]) last[a] = A[a].v; });
            if (nw.length) { try { showScanToast('📦 Nouvelle version : ' + nw.join(', ') + ' — cliquez sur « v' + ME.v + ' » en bas à gauche', 'info'); } catch (e) {} var b = $('cver-badge'); if (b) { b.classList.add('new'); } }
            Object.keys(A).forEach(function (a) { last[a] = A[a].v; });
            try { localStorage.setItem(k, JSON.stringify(last)); } catch (e) {}
        });
    }, 8000);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', badge); else badge();
})();
</script>

</body></html>
