<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <defs>
    <linearGradient id="lgRing" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#3f82e0"/>
      <stop offset="0.45" stop-color="#2560bf"/>
      <stop offset="1" stop-color="#16428a"/>
    </linearGradient>
    <radialGradient id="lgDisc" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#dde3ec"/>
    </radialGradient>
    <linearGradient id="lgC" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#ffa851"/>
      <stop offset="0.55" stop-color="#ef8a2e"/>
      <stop offset="1" stop-color="#d9691a"/>
    </linearGradient>
    <linearGradient id="lgGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lgDots" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".7" fill="#b9520f" opacity=".35"/>
    </pattern>
    <filter id="lgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2" flood-color="#7a3a08" flood-opacity=".35"/>
    </filter>
    <filter id="lgInner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0b2a5c" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- anneau bleu -->
  <circle cx="100" cy="100" r="97" fill="url(#lgRing)"/>
  <circle cx="100" cy="100" r="95.5" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="1.2"/>
  <!-- disque blanc -->
  <g filter="url(#lgInner)">
    <circle cx="100" cy="100" r="73" fill="url(#lgDisc)"/>
  </g>
  <circle cx="100" cy="100" r="73" fill="none" stroke="#8fb0e3" stroke-width="2.4"/>
  <circle cx="100" cy="100" r="69.5" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".9"/>
  <!-- C orange -->
  <g filter="url(#lgShadow)">
    <path d="M118 84.5 H145.4 A47.5 47.5 0 1 0 145.4 115.5 H118 A23 23 0 1 1 118 84.5 Z" fill="url(#lgC)"/>
    <path d="M118 84.5 H145.4 A47.5 47.5 0 1 0 145.4 115.5 H118 A23 23 0 1 1 118 84.5 Z" fill="url(#lgDots)"/>
    <path d="M118 84.5 H145.4 A47.5 47.5 0 1 0 145.4 115.5 H118 A23 23 0 1 1 118 84.5 Z" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"/>
  </g>
</svg>
